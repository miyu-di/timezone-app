<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Поточний час</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #74abe2, #5563c1);
        }
        .clock-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 2.5rem;
            margin: 0 0 10px 0;
        }
        p {
            color: #666;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
            background: #eee;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="clock-card">
    <h1 th:text="${currentTime}">2022-01-05 12:05:01</h1>
    <p th:text="${timezone}">UTC</p>
</div>
</body>
</html>
